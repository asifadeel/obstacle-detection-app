name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    container: kivy/buildozer
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: 0
        run: |
          cp -r $GITHUB_WORKSPACE/* /home/user/hostcwd/
          cd /home/user/hostcwd
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: obstacle-detection-apk
          path: /home/user/hostcwd/bin/*.apk
